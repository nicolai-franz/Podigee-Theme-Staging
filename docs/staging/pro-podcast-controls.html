<!--
  PRO Podcast – Systemsteuerung
  Release marker: 2026-08-26 live sync.
  Local comparison theme for Podigee SDK v2.
  The SDK bindings are intentionally the same as the production theme; only
  the control order and the local subscribe footer presentation differ.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800;900&display=swap" />

<div class="podcast-player pro-podcast-player pro-controls-variant">
  <div class="podcast-player-inside">
    <audio></audio>

    <button
      class="splash-button"
      pp-title="translations.playEpisode"
      pp-aria-label="translations.playEpisode"
      type="button"
    ></button>

    <div class="main-player">
      <div class="episode-content">
        <div class="episode-basic-info">
          <p class="podcast-name">Podcast „<span pp-html="podcastTitle">Glaube. Macht. Politik.</span>“</p>
          <h1 class="episode-title" pp-html="title">Episode wird geladen</h1>
          <p class="episode-subtitle" pp-if="subtitle" pp-html="subtitle"></p>
        </div>

        <div class="audio-controls" aria-label="Wiedergabe">
          <div class="control-dock" role="group" aria-label="Wiedergabesteuerung">
            <label class="speed-control">
              <span class="visually-hidden" pp-html="translations.changePlaybackSpeed">Tempo</span>
              <select
                class="speed-select"
                pp-title="translations.changePlaybackSpeed"
                pp-aria-label="translations.changePlaybackSpeed"
              >
                <option value="0.5">0,5×</option>
                <option value="1.0">1×</option>
                <option value="1.5">1,5×</option>
                <option value="2.0">2×</option>
                <option value="2.5">2,5×</option>
                <option value="3.0">3×</option>
                <option value="3.5">3,5×</option>
                <option value="4.0">4×</option>
              </select>
            </label>

            <div class="primary-transport" role="group" aria-label="Zurück, Wiedergabe und vor">
              <button
                class="backward-button skip-button"
                pp-title="translations.backward"
                pp-aria-label="translations.backward"
                type="button"

              <button
                class="play-button"
                pp-aria-label="translations.playPause"
                pp-title="translations.playPause"
                type="button"
              >

                </svg>
                <svg class="control-icon pause-symbol" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <rect x="6.8" y="5.5" width="4" height="13" rx="0.9"/>
                  <rect x="13.2" y="5.5" width="4" height="13" rx="0.9"/>
                </svg>
                <span class="play-duration" pp-if="humanDuration" pp-html="humanDuration"></span>
              </button>

              <button
                class="forward-button skip-button"
                pp-title="translations.forward"
                pp-aria-label="translations.forward"
                type="button"
              >

                </svg>
              </button>
            </div>

            <progressbar></progressbar>
          </div>
        </div>

        <div class="playback-tools" aria-label="Weitere Wiedergabeoptionen">
          <button
            class="previous-button skip-backward-button disabled"
            pp-title="translations.previous"
            pp-aria-label="translations.previous"
            type="button"
          >Vorherige Folge</button>
          <button
            class="next-button skip-forward-button disabled"
            pp-title="translations.next"
            pp-aria-label="translations.next"
            type="button"
          >Nächste Folge</button>
        </div>
      </div>

      <div class="episode-artwork">
        <img
          class="cover-image"
          pp-src="coverUrl | scale 640"
          pp
          pp-alt="title"
        />
      </div>
    </div>

    <div class="player-bottom">
      <footer class="footer subscribe-footer">
        <div class="footer-actions" aria-label="Podcast abonnieren">
          <div class="buttons"></div>
        </div>

        <button
          class="all-episodes-link playlist-button episodes-popover-trigger"
          type="button"
          aria-controls="pro-episodes-panel"
          aria-expanded="false"
          pp-title="translations.allEpisodes"
          pp-aria-label="translations.allEpisodes"
        >
          <span pp-html="translations.allEpisodes">Alle Episoden</span>
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M9.29 6.71a.996.996 0 0 1 1.41 0L16 12l-5.3 5.29a.996.996 0 1 1-1.41-1.41L13.17 12 9.29 8.12a.996.996 0 0 1 0-1.41z"/>
          </svg>
        </button>

      </footer>

      <section class="panels-shell subscribe-panels-shell" aria-labelledby="subscribe-panel-title">
        <h2 class="subscribe-panel-title" id="subscribe-panel-title">Podcast abonnieren</h2>
        <div class="panels" aria-label="Podcast-Abos"></div>
      </section>
    </div>
  </div>
</div>

<script>
  /*
   * Podigee's script embed starts every iframe at 150px. External themes must
   * report their actual document height back to the parent player whenever
   * their content changes (for example when a panel opens).
   */
  (function () {
    if (window.parent === window) return;

    var pending = false;
    var playerId = new URLSearchParams(window.location.search).get("id");

    function playerHeight() {
      var player = document.querySelector(".pro-podcast-player");
      var body = document.body;
      var root = document.documentElement;
      var bottom = player
        ? Math.ceil(player.offsetTop + Math.max(player.offsetHeight, player.scrollHeight))
        : 0;

      return Math.ceil(Math.max(
        bottom,
        body ? body.scrollHeight : 0,
        body ? body.offsetHeight : 0,
        root.scrollHeight,
        root.offsetHeight,
        root.clientHeight
      ));
    }

    function reportHeight() {
      pending = false;
      var message = {
        listenTo: "configurePlayer",
        height: playerHeight()
      };

      if (playerId) message.id = playerId;
      window.parent.postMessage(JSON.stringify(message), "*");
    }

    function scheduleReport() {
      if (pending) return;
      pending = true;
      window.requestAnimationFrame(reportHeight);
    }

    function setupPanelController() {
      var player = document.querySelector(".pro-controls-variant");
      if (!player || player.dataset.panelController) return;

      player.dataset.panelController = "ready";

      function panels() {
        return player.querySelector(".subscribe-panels-shell .panels");
      }

      function subscribeTrigger() {
        return player.querySelector(".subscribe-menu-button");
      }

      function playlistTrigger() {
        return player.querySelector(".subscribe-footer .playlist-button");
      }

      function isOpen(kind) {
        var mount = panels();
        return Boolean(mount && mount.classList.contains(kind + "-open"));
      }

      function syncPanels() {
        var playlistButton = playlistTrigger();
        var subscribeButton = subscribeTrigger();
        var playlistOpen = isOpen("playlist");
        var subscribeOpen = isOpen("subscribe-menu");

        player.classList.toggle("is-playlist-open", playlistOpen);
        if (playlistButton) playlistButton.setAttribute("aria-expanded", String(playlistOpen));
        if (subscribeButton) subscribeButton.setAttribute("aria-expanded", String(subscribeOpen));
        scheduleReport();
      }

      function closeNativePanel(kind, restoreFocus) {
        if (!isOpen(kind)) return;

        var trigger = kind === "playlist" ? playlistTrigger() : subscribeTrigger();
        if (trigger) trigger.click();

        window.setTimeout(function () {
          syncPanels();
          if (restoreFocus && trigger) trigger.focus();
        }, 0);
      }

      /* Podigee animates menu panels for 300ms and resizes the iframe during
         each step. Disable that one SDK animation only for the subscribe
         trigger and its close control, so providers are available at once. */
      var savedFxOff = null;
      var restoreFxTimer = null;

      function openSubscribeWithoutDelay(event) {
        var target = event.target.closest(
          ".subscribe-menu-button, .subscribe-menu .close-button"
        );
        var jq = window.jQuery || window.$;
        if (!target || !jq || !jq.fx) return;

        if (savedFxOff === null) savedFxOff = jq.fx.off;
        jq.fx.off = true;
        window.clearTimeout(restoreFxTimer);
        restoreFxTimer = window.setTimeout(function () {
          jq.fx.off = savedFxOff;
          savedFxOff = null;
        }, 0);
      }

      player.addEventListener("click", openSubscribeWithoutDelay, true);

      player.addEventListener("click", function (event) {
        var playlistButton = event.target.closest(".subscribe-footer .playlist-button");
        var subscribeButton = event.target.closest(".subscribe-menu-button");
        var episode = event.target.closest(".single-playlist-episode");

        if (playlistButton || subscribeButton) {
          window.setTimeout(syncPanels, 0);
          return;
        }

        if (episode) {
          window.setTimeout(function () {
            closeNativePanel("playlist", true);
          }, 0);
        }
      });

      document.addEventListener("pointerdown", function (event) {
        var shell = player.querySelector(".subscribe-panels-shell");
        var target = event.target;
        var activeKind = isOpen("playlist") ? "playlist" :
          (isOpen("subscribe-menu") ? "subscribe-menu" : null);

        if (!activeKind || !shell || shell.contains(target)) return;
        if (subscribeTrigger() && subscribeTrigger().contains(target)) return;
        if (playlistTrigger() && playlistTrigger().contains(target)) return;

        closeNativePanel(activeKind, false);
      });

      document.addEventListener("keydown", function (event) {
        if (event.key !== "Escape") return;
        if (isOpen("playlist")) {
          event.preventDefault();
          closeNativePanel("playlist", true);
        } else if (isOpen("subscribe-menu")) {
          event.preventDefault();
          closeNativePanel("subscribe-menu", true);
        }
      });

      new MutationObserver(syncPanels).observe(player, {
        attributes: true,
        attributeFilter: ["class"],
        childList: true,
        subtree: true
      });

      syncPanels();
    }

    window.addEventListener("DOMContentLoaded", scheduleReport);
    window.addEventListener("load", scheduleReport);
    window.addEventListener("load", setupPanelController);
    window.addEventListener("resize", scheduleReport);

    if (window.ResizeObserver) {
      var resizeObserver = new ResizeObserver(scheduleReport);
      resizeObserver.observe(document.documentElement);
      if (document.body) resizeObserver.observe(document.body);
    }

    if (window.MutationObserver && document.body) {
      new MutationObserver(scheduleReport).observe(document.body, {
        childList: true,
        subtree: true
      });
    }

    window.setTimeout(scheduleReport, 0);
    window.setTimeout(scheduleReport, 250);
    window.setTimeout(scheduleReport, 1000);
    window.setTimeout(setupPanelController, 0);
  })();
</script>
